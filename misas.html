<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misas - Monaguillos Santo Domingo Savio</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Permite que la tarjeta crezca hacia abajo según el tamaño de la imagen */


        /* Estilos del contenedor de la imagen */
        .content-image-box {
            margin-top: 20px !important;
            width: 100% !important;
            height: auto !important;
            max-height: none !important;
            display: none; /* Oculto por defecto si no hay imagen */
            justify-content: center !important;
            align-items: center !important;
            border-radius: 8px !important;
            padding: 10px !important;
            box-sizing: border-box !important;
        }

        /* Garantiza que la imagen se despliegue completa, sin recortes */
        .content-image-box img {
            width: 100% !important;
            height: auto !important;
            max-height: none !important;
            object-fit: contain !important;
            display: block !important;
            border-radius: 6px !important;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <!-- Barra Lateral (Sidebar) -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-logo">
                <img src="logo.jpg" alt="Monaguillos Santo Domingo Savio" class="banner-logo">
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="calendario.html">Calendario</a></li>
                <li><a href="tesoreria.html">Tesoreria</a></li>
                <li><a href="vidafraterna.html">Vida Fraterna</a></li>
                <li class="active"><a href="misas.html">Misas</a></li>
                <li><a href="comunicacion.html">Comunicación</a></li>
                <li><a href="eventos.html">Eventos especiales</a></li>
                <li><a href="equipo.html">Equipo de Coordinación</a></li>
                <li><a href="galeria.html">Galeria</a></li>
            </ul>
        </aside>

        <!-- Contenido Principal -->
        <main class="dashboard-main-content">
            <!-- Barra Superior -->
            <header class="dashboard-topbar">
                <div class="dashboard-title">
                    <h1>Misas</h1>
                    <p>Monaguillos Santo Domingo Savio</p>
                </div>
                <div class="topbar-right">
                    <button id="btnCerrarSesion" class="btn-cerrar-sesion">Cerrar sesión</button>
                </div>
            </header>

            <!-- Cuerpo del Panel -->
             <div class="dashboard-content-body">
                <div class="about-container">
                    <div class="hero-card_2 fondo6-bg" style="position: relative;">
                        <div class="card-overlay_2">
                            
                            <h2>Misas</h2>

                            <!-- APARTADO 1: CALENDARIO LITURGICO -->
                            <h1>CALENDARIO LITURGICO</h1>
                            <div class="image-controls">
                                <label for="inputImagen1" class="btn-upload">Subir imagen</label>
                                <input type="file" id="inputImagen1" accept="image/*" style="display: none;">
                                <button id="btnEliminarImagen1" class="btn-delete" style="display: none;">Eliminar imagen</button>
                            </div>
                            <div class="content-image-box" id="imageContainer1">
                                <img id="imagenPrevisualizacion1" src="" alt="">
                            </div>

                            <!-- APARTADO 2: CALENDARIO PARROQUIAL -->
                            <h1>CALENDARIO PARROQUIAL</h1>
                            <div class="image-controls">
                                <label for="inputImagen2" class="btn-upload">Subir imagen</label>
                                <input type="file" id="inputImagen2" accept="image/*" style="display: none;">
                                <button id="btnEliminarImagen2" class="btn-delete" style="display: none;">Eliminar imagen</button>
                            </div>
                            <div class="content-image-box" id="imageContainer2">
                                <img id="imagenPrevisualizacion2" src="" alt="">
                            </div>

                            <!-- APARTADO 3: PLANTILLA DE ASISTENCIA -->
                            <h1>PLANTILLA DE ASISTENCIA</h1>
                            <div class="image-controls">
                                <label for="inputImagen3" class="btn-upload">Subir imagen</label>
                                <input type="file" id="inputImagen3" accept="image/*" style="display: none;">
                                <button id="btnEliminarImagen3" class="btn-delete" style="display: none;">Eliminar imagen</button>
                            </div>
                            <div class="content-image-box" id="imageContainer3">
                                <img id="imagenPrevisualizacion3" src="" alt="">
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK v10 (Firestore en tiempo real) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tus credenciales reales de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD1F2QFk-q3vxvB2nVNRAHpxcSWAdLBihI",
            authDomain: "monaguillos-7b723.firebaseapp.com",
            projectId: "monaguillos-7b723",
            storageBucket: "monaguillos-7b723.firebasestorage.app",
            messagingSenderId: "514601789417",
            appId: "1:514601789417:web:ec5cdbb548ec8475a48d78",
            measurementId: "G-3HCZZF2YLX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Control de sesión básica
        if (localStorage.getItem('sesionIniciada') !== 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            localStorage.removeItem('sesionIniciada');
            window.location.href = 'index.html';
        });

        // Función para sincronizar cada apartado con Firestore en tiempo real
        function configurarSeccionCloud(idInput, idContainer, idPreview, idBtnEliminar, docId) {
            const input = document.getElementById(idInput);
            const container = document.getElementById(idContainer);
            const preview = document.getElementById(idPreview);
            const btnEliminar = document.getElementById(idBtnEliminar);

            // Referencia al documento específico en la colección "misas"
            const docRef = doc(db, "misas", docId);

            // Escuchar cambios en tiempo real desde la nube para este apartado
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().url) {
                    preview.src = docSnap.data().url;
                    container.style.display = 'flex';
                    btnEliminar.style.display = 'inline-block';
                } else {
                    preview.src = '';
                    container.style.display = 'none';
                    btnEliminar.style.display = 'none';
                }
            });

            // Al seleccionar una nueva imagen, convertir a Base64 y guardar en Firestore
            input.addEventListener('change', (event) => {
                const archivo = event.target.files[0];
                if (archivo) {
                    const lector = new FileReader();
                    lector.onload = async function(e) {
                        try {
                            const base64Image = e.target.result;
                            await setDoc(docRef, { url: base64Image });
                        } catch (error) {
                            console.error("Error al guardar en la nube:", error);
                            alert("Ocurrió un error al subir la imagen a la nube.");
                        }
                    };
                    lector.readAsDataURL(archivo);
                }
            });

            // Al presionar eliminar, borrar de la nube
            btnEliminar.addEventListener('click', async () => {
                if (confirm('¿Deseas eliminar esta imagen para todos los usuarios?')) {
                    try {
                        await deleteDoc(docRef);
                        input.value = '';
                    } catch (error) {
                        console.error("Error al eliminar de la nube:", error);
                        alert("Ocurrió un error al borrar la imagen.");
                    }
                }
            });
        }

        // Inicializar las 3 secciones conectadas a documentos independientes en Firestore
        configurarSeccionCloud('inputImagen1', 'imageContainer1', 'imagenPrevisualizacion1', 'btnEliminarImagen1', 'liturgico');
        configurarSeccionCloud('inputImagen2', 'imageContainer2', 'imagenPrevisualizacion2', 'btnEliminarImagen2', 'parroquial');
        configurarSeccionCloud('inputImagen3', 'imageContainer3', 'imagenPrevisualizacion3', 'btnEliminarImagen3', 'asistencia');
    </script>
</body>
</html>
