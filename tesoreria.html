<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesoreria - Monaguillos Santo Domingo Savio</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Barra Lateral (Sidebar) -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-logo">
                <img src="logo.jpg" alt="Monaguillos Santo Domingo Savio" class="banner-logo">
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="calendario.html">Calendario</a></li>
                <li class="active"><a href="tesoreria.html">Tesoreria</a></li>
                <li><a href="vidafraterna.html">Vida Fraterna</a></li>
                <li><a href="misas.html">Misas</a></li>
                <li><a href="comunicacion.html">Comunicación</a></li>
                <li><a href="eventos.html">Eventos especiales</a></li>
                <li><a href="equipo.html">Equipo de Coordinación</a></li>
                <li><a href="galeria.html">Galeria</a></li>
            </ul>
        </aside>

        <!-- Contenido Principal -->
        <main class="dashboard-main-content">
            <!-- Barra Superior -->
            <header class="dashboard-topbar">
                <div class="dashboard-title">
                    <h1>Tesoreria</h1>
                    <p>Monaguillos Santo Domingo Savio</p>
                </div>
                <div class="topbar-right">
                    <button id="btnCerrarSesion" class="btn-cerrar-sesion">Cerrar sesión</button>
                </div>
            </header>

            <!-- Cuerpo del Panel -->
            <div class="dashboard-content-body">
                <div class="about-container">
                    <div class="hero-card_2 fondo7-bg" style="position: relative;">
                        <div class="card-overlay_2">
                            
                            <h2>Ingresos y gastos</h2>

                            <!-- APARTADO 1: REPORTES DE INGRESOS Y GASTOS DEL GRUPO -->
                            <h1>REPORTE DE INGRESOS Y GASTOS DEL GRUPO</h1>
                            <div class="pdf-management-box">
                                <div id="container-domingo-savio">
                                    <!-- Se cargará dinámicamente desde la nube -->
                                </div>
                                <div class="admin-controls">
                                    <input type="file" id="input-domingo-savio" accept=".xlsx, .xls, .csv" style="display: none;">
                                    <button id="btnUploadExcel" class="btn-upload">Subir Excel</button>
                                    <button id="btn-delete-domingo-savio" class="btn-delete" style="display: none;">Eliminar Excel</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK v10 (Firestore en tiempo real para sincronizar el Excel) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tus credenciales reales de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD1F2QFk-q3vxvB2nVNRAHpxcSWAdLBihI",
            authDomain: "monaguillos-7b723.firebaseapp.com",
            projectId: "monaguillos-7b723",
            storageBucket: "monaguillos-7b723.firebasestorage.app",
            messagingSenderId: "514601789417",
            appId: "1:514601789417:web:ec5cdbb548ec8475a48d78",
            measurementId: "G-3HCZZF2YLX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Control de sesión básica
        if (localStorage.getItem('sesionIniciada') !== 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            localStorage.removeItem('sesionIniciada');
            window.location.href = 'index.html';
        });

        // Referencias a los elementos de la interfaz
        const inputFile = document.getElementById('input-domingo-savio');
        const btnUpload = document.getElementById('btnUploadExcel');
        const container = document.getElementById('container-domingo-savio');
        const deleteBtn = document.getElementById('btn-delete-domingo-savio');

        // Referencia al documento en la colección "tesoreria" de Firestore
        const docRef = doc(db, "tesoreria", "reportePrincipal");

        // Vincular el botón visual con el input oculto de archivos
        btnUpload.addEventListener('click', () => {
            inputFile.click();
        });

        // Escuchar en tiempo real los cambios en la nube (para que todos vean el Excel actualizado)
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().dataUrl) {
                const fileData = docSnap.data();
                container.innerHTML = `
                    <div class="pdf-link-card">
                        <a href="${fileData.dataUrl}" download="${fileData.name}" class="btn-pdf-link">
                            <span class="pdf-icon" style="background-color: #107c41; color: white; padding: 4px 8px; border-radius: 4px;">Excel</span>
                            <span class="pdf-title">${fileData.name}</span>
                        </a>
                    </div>
                `;
                deleteBtn.style.display = 'inline-flex';
            } else {
                container.innerHTML = `<p class="no-pdf-text">Sube un archivo Excel.</p>`;
                deleteBtn.style.display = 'none';
            }
        });

        // Subir archivo Excel, convertirlo y guardarlo en Firestore
        inputFile.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const validExtensions = ['.xlsx', '.xls', '.csv'];
            const fileExtension = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();

            if (!validExtensions.includes(fileExtension) && !file.type.includes('excel') && !file.type.includes('spreadsheet') && !file.type.includes('csv')) {
                alert('Por favor, selecciona un archivo de Excel válido (.xlsx, .xls o .csv).');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const base64File = e.target.result;
                    await setDoc(docRef, {
                        name: file.name,
                        dataUrl: base64File
                    });
                } catch (error) {
                    console.error("Error al guardar el Excel en la nube:", error);
                    alert('No se pudo subir el archivo a la nube.');
                }
            };
            reader.readAsDataURL(file);
        });

        // Eliminar el archivo de la nube
        deleteBtn.addEventListener('click', async () => {
            if (confirm('¿Deseas eliminar este archivo Excel para todos los usuarios?')) {
                try {
                    await deleteDoc(docRef);
                    inputFile.value = '';
                } catch (error) {
                    console.error("Error al eliminar el Excel de la nube:", error);
                    alert('No se pudo eliminar el archivo.');
                }
            }
        });
    </script>
</body>
</html>
